name: Render original affiliate pilot Shorts
on:
  push:
    branches:
      - pilot/affiliate-shorts-20261120
    paths:
      - .github/workflows/affiliate-pilot-render.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare free local renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q Pillow
      - name: Render 3 self-made short videos
        run: python -u tools/affiliate_pilot_render.py
      - name: Upload generated media to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/affiliate-pilot
          if ! git diff --staged --quiet; then
            git commit -m "Render free original AI Shorts pilot media [skip ci]"
            git push origin HEAD:pilot/affiliate-shorts-20261120
          fi
